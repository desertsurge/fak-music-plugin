name: publish-catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'scripts/catalog-generator.mjs'
      - 'scripts/catalog-generator.test.mjs'
      - 'scripts/check-catalog.mjs'
      - 'scripts/workflow-contract.test.mjs'
      - 'scripts/fixtures/**'
      - 'src/shared/catalog.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-catalog.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Generate live catalog
        run: npm run catalog:generate

      - name: Validate catalog contract
        run: npm run catalog:check -- --input catalog/generated

      - name: Build extension
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/generated

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
